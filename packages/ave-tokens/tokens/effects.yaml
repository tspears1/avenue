elevation:
  lowest:
    color: oklch(0% 0 0 / 8%)
    offsetX: 0px
    offsetY: 1px
    blur: 2px
    spread: 0px
  low:
    color: oklch(0% 0 0 / 10%)
    offsetX: 0px
    offsetY: 2px
    blur: 4px
    spread: 0px
  medium:
    - color: oklch(0% 0 0 / 8%)
      offsetX: 0px
      offsetY: 1px
      blur: 2px
      spread: 0px
    - color: oklch(0% 0 0 / 12%)
      offsetX: 0px
      offsetY: 4px
      blur: 12px
      spread: 0px
  high:
    color: oklch(0% 0 0 / 14%)
    offsetX: 0px
    offsetY: 8px
    blur: 24px
    spread: 0px
  highest:
    color: oklch(0% 0 0 / 18%)
    offsetX: 0px
    offsetY: 16px
    blur: 48px
    spread: 0px
